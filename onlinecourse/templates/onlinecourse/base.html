{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OnlineCourse{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'onlinecourse/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'onlinecourse/course.css' %}">
</head>
<body>
  <header class="site-header border-bottom">
    <nav class="container content-width d-flex justify-content-between align-items-center py-3" aria-label="Main">
      <a class="brand" href="{% url 'onlinecourse:catalog' %}">OnlineCourse</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-secondary">Sign out</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'login' %}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main class="container content-width py-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
