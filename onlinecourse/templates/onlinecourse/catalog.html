{% extends "onlinecourse/base.html" %}
{% block title %}Courses | OnlineCourse{% endblock %}
{% block content %}
<h1 class="mb-4">Courses</h1>
<div class="row g-3">
  {% for course in courses %}
    <div class="col-md-6">
      <article class="card h-100">
        <div class="card-body p-4">
          <h2 class="h4">{{ course.name }}</h2>
          <p>{{ course.description }}</p>
          <a class="btn btn-primary" href="{% url 'onlinecourse:course_detail' course.pk %}">View course</a>
        </div>
      </article>
    </div>
  {% empty %}
    <p>No courses are available.</p>
  {% endfor %}
</div>
{% endblock %}
